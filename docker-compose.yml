services:
  credit-risk-api:
    build: .
    container_name: credit-risk-api
    ports:
      - "8000:8000"
    volumes:
      - ./artifacts:/app/artifacts:ro
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    # No healthcheck override here: the Dockerfile probe uses `requests`, which is
    # installed. The previous override called `curl`, which python:*-slim does not ship,
    # so the container was permanently marked unhealthy.
