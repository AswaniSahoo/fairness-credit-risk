name: CI
on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-api.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt -r requirements-api.txt

      - name: Lint
        run: ruff check

      # mypy may fail on legacy modules that predate the type-checked rewrite;
      # those are scheduled for removal and should not block unrelated PRs.
      - name: Type check
        run: mypy src api config
        continue-on-error: true

      - name: Test
        run: >
          pytest -m "unit or integration"
          --cov=src --cov=api --cov-report=term-missing
